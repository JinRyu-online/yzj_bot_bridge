# 首次启动写入 ~/.yzj-bridge/config.yaml 的默认模板（无真实密钥）。
# 请在 GUI「机器人 / AI 设置」中补全 send_msg_url、API Key 等；勿把真实密钥提交到 Git。

defaults:
  cursor_api_key: ""                    # 或环境变量 CURSOR_API_KEY
  openai_api_key: ""
  openai_base_url: ""
  openai_model: ""
  openai_timeout: 120
  openai_max_tool_rounds: 8
  openai_compact: true                 # 仅 openai：多轮过长时自动摘要压缩
  openai_compact_keep: 6               # 保留最近几条原文（3 轮问答）
  openai_compact_after_turns: 10       # 超过该条数才压缩
  openai_compact_after_runes: 8000     # 或历史总字数超过该值（DeepSeek Flash 按字数早压，不靠 1M 窗口）
  projects_root: "~"
  projects: []                          # 可选：[{ name, path, aliases }]
  cursor_bin: "agent"                   # 建议绝对路径
  claude_bin: "claude"                  # Windows 建议 claude.exe（勿用 claude.cmd）
  cursor_model: ""
  claude_model: ""
  # DSH（DeepSeek Harness）后端：默认调用 DSH 桌面客户端自带的 headless CLI
  # （dsh --profile yzj-headless，一条消息一个进程，--session-id 续会话）。
  # 桥会探测桌面客户端（注册表 / 常见安装目录），用它自带 runtime，并自动生成
  # ~/.dsh/profiles/yzj-headless（复制桌面里的模型 provider 配置）。
  # sdk = 常驻官方 SDK JSON-RPC server；cli = 旧独立 node + dsh 入口。
  dsh_mode: "headless"                # headless（默认，桌面 headless CLI）| sdk | cli
  dsh_desktop_path: ""                # 桌面客户端目录或 exe；留空自动探测
  node_bin: "node"                    # 仅 cli 模式：node 可执行文件（或绝对路径）
  dsh_entry: ""                       # 仅 cli 模式：DSH bin.js 入口
  dsh_profile: "jsonrpc"              # headless 自动映射 yzj-headless，sdk 自动映射 yzj-sdk；cli 模式默认 jsonrpc
  dsh_provider: "kuaidi100"           # LLM provider（桌面客户端 profile 中配置）
  dsh_model: ""                       # 空=复用机器人 model，再空=deepseek-v4-flash
  dsh_reasoning_effort: ""            # DSH 思考强度：空=模型默认 | off(关闭思考) | low | medium | high
  dsh_timeout: 600                    # 单轮超时秒
  dsh_ttl_seconds: 300                # 池进程空闲回收秒
  dsh_max_warm: 3                     # 池进程硬上限（超出按 LRU 提前回收）
  dsh_home: ""                        # DSH 家目录；留空默认 ~/.dsh
  session_mode: "shared"              # per_user | shared | oneshot。shared=同通道共享上下文，且通道内排队
  session_idle_reset_hours: 3        # 同一会话超过 N 小时无请求则自动新开会话；0=关闭
  job_queue: ""                         # 空=shared 时 channel，否则 user；也可显式 user | channel
  allow_users: []
  cursor_timeout: 600
  ack_pending: true
  mention_on_reply: true
  cursor_sandbox: "disabled"
  cursor_force: true
  cursor_stream: true
  cursor_stream_partial: true
  cursor_daily_reset: true               # cursor_cli：按本机自然日懒重置 --resume 会话；关掉写 false
  log_level: "info"
  commands_enabled: true
  reconnect_delay_sec: 5
  reconnect_max_delay_sec: 60
  heartbeat_interval_sec: 30
  sessions_file: "sessions.json"
  conversations_dir: "logs/conversations"
  inbound_mode: websocket               # websocket | webhook | both
  webhook_host: "0.0.0.0"
  webhook_port: 8765
  stale_ms: 45000
  ws_debug_frames: false                  # true=把 WSS 原始帧（截断 4KB）写进运行日志，用于排查/抓帧
  ws_invalid_frame_limit: 3
  ws_auth_fail_limit: 3                   # 连续鉴权失败（如 openToken 过期）达到该次数后自动停用通道
  # yzj-cli 轮询入站（inbound_mode: yzj_cli）：只轮询下面 bots/channels 显式配置的群。
  # 需要本机 yzj-cli 已登录（yzj-cli auth login），桥不保存任何云之家凭据。
  yzj_cli:
    bin: ""                             # 空=自动探测 PATH / npm 全局 / 受控目录
    version: "0.1.8"                    # 自动安装固定版本
    profile: "default"
    config_dir: ""                      # 空=~/.yzj-cli
    auto_install: true                  # 缺失时自动下载官方 .pak 并校验 SHA256
    timeout_sec: 20
    poll_interval_sec: 5                # 仅对已配置群轮询，±20% 抖动；遇 10000429 自动退避
    catchup_pages: 3                    # 单次最多向前翻 3 页（每页 ≤20 条）
    startup_mode: baseline              # baseline=首次只建游标不回放；replay=回放最近 20 条
    image_trigger: quote_bot            # quote_bot=引用机器人的图片才触发 | any | off
    image:
      enabled: true
      max_mb: 20
      keep_days: 7
    attachment:                           # 图片/文件附件下载（WSS 与轮询共用）
      files_enabled: true                 # false=只下载图片，文件只保留 [文件]:名字 占位
      file_max_mb: 50                     # 单个文件大小上限
      max_files: 5                        # 单条消息最多处理多少个附件
      file_block_ext: [".exe", ".dll", ".msi", ".scr", ".com", ".bat", ".cmd", ".vbs", ".ps1", ".lnk", ".jar"]
  max_workers: 4
  skills_dir: "~/.yzj-bridge/skills"    # 已安装 Skill 包目录；bots[].skills 为白名单 id
  memory:
    enabled: false                      # 总开关；默认关，开启前建议 probe openai / 确认 claude 可用
    after_turns: 8                      # 该人跨 bot 新增完成问答对达到 N 后异步画像
    idle_sec: 1800                      # 空闲刷新：距 last_seen 超过该秒且仍有未画像对
    appendix_runes: 800                 # 注入附录硬顶（只截记忆段）
    style_runes: 400
    donts_max: 8
    profiler_max_turns: 24
    profiler_max_runes: 12000
    fact_cards_enabled: false
    fact_card_ttl_days: 14
    fact_cards_max: 12
    model: ""                           # 空=复用全局 openai_model
    openai_base_url: ""
    openai_api_key: ""
    timeout: 0                          # 空/0=复用 openai_timeout
    gui_bind_enabled: false             # GUI 聊天可选记忆档案用户，绑定真人 openID 后才走记忆

groups:
  - id: default
    description: "默认分组"

bots:
  - id: fairy
    name: "Fairy"
    backend: cursor_cli                 # cursor_cli | claude_code | openai | opencode | dsh
    # 也可改为 openai，并设置 model / openai_base_url / openai_api_key
    system_prompt: |
      你是 Fairy，本地编程与排障助手。
      云之家已支持 Markdown 渲染，回复可直接使用 Markdown：## 标题、**加粗**、`行内代码`、```代码块```、表格、[链接](url)。
      回答简洁，适度用 Markdown 结构化排版。
    skills: []                          # 桥管 Skill id 白名单，见 docs/skills.md / GUI「Skills」
    # workspace 留空则自动补全为 ~/.yzj-bridge/workspace/{机器人 id}
    allow_users: []
    group: default
    send_msg_url: "https://www.yunzhijia.com/gateway/robot/webhook/send?yzjtype=0&yzjtoken=REPLACE_ME"
    # 多通道写法：用 channels 数组代替 group/send_msg_url
    # inbound_mode=yzj_cli 时，每个通道必须写自己的 yzj_group_id；
    # 同群多机器人时再写 yzj_bot_open_id（BOT-...），用于精确识别 @ 目标。
    # channels:
    #   - group: workAssistant
    #     send_msg_url: "https://...yzjtoken=REPLACE_A"
    #     yzj_group_id: "6a2b..."
    #     yzj_group_name: "示例群"
    #     yzj_bot_open_id: "BOT-..."
    #   - group: development
    #     send_msg_url: "https://...yzjtoken=REPLACE_B"
    #     yzj_group_id: "6a95..."
