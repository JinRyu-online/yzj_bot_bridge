name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      # CI uses MSVC; local rust-toolchain.toml pins GNU for this machine's linker.
      - name: Prefer MSVC toolchain in CI
        shell: pwsh
        run: |
          Remove-Item -Force gui/src-tauri/rust-toolchain.toml -ErrorAction SilentlyContinue
          Remove-Item -Force gui/src-tauri/.cargo/config.toml -ErrorAction SilentlyContinue

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      - name: Build Go bridge
        working-directory: bridge
        run: |
          go test ./...
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -o bin/yzj-bridge.exe ./cmd/yzj-bridge

      - name: Prepare Tauri sidecar
        run: powershell -File ./scripts/prepare-bundle.ps1

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build NSIS installer
        working-directory: gui
        run: npm run tauri -- build --target x86_64-pc-windows-msvc

      - name: Collect dist artifacts
        run: powershell -File ./scripts/package-windows.ps1

      - name: Upload installer (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: YZJBridge-Windows-x64-setup
          path: |
            dist/YZJBridge-*-Windows-x64-setup.exe
            dist/YZJBridge-Windows-x64-setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YZJBridge-*-Windows-x64-setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
